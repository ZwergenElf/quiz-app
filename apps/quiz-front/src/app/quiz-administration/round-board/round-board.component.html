<div class="component">
  <ng-container *ngIf="question">
    <div class="container">
      <mat-card>
        <mat-card-content>Frage: {{ question.question }}</mat-card-content>
      </mat-card>
    </div>
    <div class="container">
      <mat-card>
        <mat-card-content>Antwort: {{ question.answer }}</mat-card-content>
      </mat-card>
    </div>
  </ng-container>
</div>
