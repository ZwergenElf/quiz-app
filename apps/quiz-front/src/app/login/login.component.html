<form [formGroup]="loginForm">
    <mat-form-field>
      <mat-label>Username</mat-label>
      <input [formControl]="usernameControl" matInput>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password</mat-label>
      <input [formControl]="passwordControl" matInput>
    </mat-form-field>
    <button mat-button>Login</button>
</form>
